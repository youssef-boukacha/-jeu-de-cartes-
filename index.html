<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
<link rel="stylesheet" href="./src/output.css">

<body class="body bg-[url('./images/background.jpg')]">
           <!-------------------------------Header---------------------->
   
    <header>
        <div class="flex justify-between  px-4 py-4">
        
            <div >
            <img src="./src/images/Empereur Citoyen Esclave Emblem.png" alt="logo" width="80" height="80"
                class="rounded-md ">
        </div>

        <div class="flex gap-4">
            <div id="img" class=" flex"  >
                 <p class="text-white"> </p>

            <div>
                <button type="button" id="deconnexion" class=" border-2 rounded-md text-white"> Déconnexion</button>
            </div>
        </div>
        </div>

    <section class="hidden">

                <!-- Personne de gauche -->
                <circle cx="6.5" cy="8.5" r="3.5" />
                <path d="M6.5 13c-3.04 0-5.5 1.9-5.5 4.25V20h11v-2.75C12 14.9 9.54 13 6.5 13z" />

                <!-- Personne de droite -->
                <circle cx="17.5" cy="8.5" r="3.5" />

                <circle cx="12" cy="11.5" r="4" stroke-width="1.5" />
                <path d="M12 16.5c-3.5 0-6.5 2.1-6.5 4.7v0.8h13v-0.8c0-2.6-3-4.7-6.5-4.7z" stroke-width="1.5" />

        </div>

        <!--div pour ajoute et modifier un joueur-->
        <div class="mx-7 mt-10 bg-[#0F172A] h-70 rounded-xl">

            <div class="flex mx-4">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="40" height="40" fill="currentColor">
                    <circle cx="6.5" cy="8.5" r="3.5" />
                    <path d="M6.5 13c-3.04 0-5.5 1.9-5.5 4.25V20h11v-2.75C12 14.9 9.54 13 6.5 13z" />
                </svg>
                <p class="text-white italic font-serif"> Ajouter / Modifier Un joueure </p>
            </div>
            <div class="px-4 p-2">
                <p class="text-white font-serif">enter your nickname</p>
                <input type="text" id="nickname" class="bg-[#1F2937] rounded-xl text-white w-50 "
                    placeholder="entrez votre nom">
            </div>

            </div>
            <!----------------------div for avatars --------------------->
            <div class=" grid grid-cols-5 gap-4 mt-5 px-18" id="avatars">

                    class="w-10 h-10 cursor-pointer border-2 border-transparent" id="avatar1">
                <img src="./src/images/cleopatra.svg" alt="Avatar"
                    class="w-10 h-10 cursor-pointer border-2 border-transparent" id="avatar2">

                <img src="./src/images/hound.svg" alt="Avatar"
                    class="w-10 h-10 cursor-pointer border-2 border-transparent" id="avatar3">
                <img src="./src/images/invisible-face.svg" alt="Avatar"
                    class="w-10 h-10 cursor-pointer border-2 border-transparent" id="avatar4">

            </div>
            <div class=" pt-8  px-8 pl-24">
                <button type="button" id="Enregistrer"
                    class="bg-[#3B82F6] text-white rounded-xl w-25">Enregistrer</button>
            </div>

        </div>

        <div id="players-list" class="mx-7 mt-10 bg-[#0F172A] h-70 rounded-xl p-4">
            <div class="flex gap-4">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="40" height="40" fill="currentColor">
                    <!-- Personne de gauche -->
                    <circle cx="6.5" cy="8.5" r="3.5" />
                    <path d="M6.5 13c-3.04 0-5.5 1.9-5.5 4.25V20h11v-2.75C12 14.9 9.54 13 6.5 13z" />

                    <!-- Personne de droite -->
                    <circle cx="17.5" cy="8.5" r="3.5" />
                    <path d="M17.5 13c-3.04 0-5.5 1.9-5.5 4.25V20h11v-2.75c0-2.35-2.46-4.25-5.5-4.25z" />

                    <!-- Personne au centre (au premier plan avec bordure blanche) -->
                    <circle cx="12" cy="11.5" r="4" stroke-width="1.5" />
                    <path d="M12 16.5c-3.5 0-6.5 2.1-6.5 4.7v0.8h13v-0.8c0-2.6-3-4.7-6.5-4.7z" stroke-width="1.5" />
                </svg>
                <p class="font-serif text text-white text-left">Liste des joueurs</p>
            </div>

        </div>

    </section>
    <!--------------------------------------------Deuxieme Section De Jeu------------------------------------>
    <section>
        <div class=" grid grid-cols-2 bg-[#0F172A] mx-4 px-4  rounded-xl gap-4">

                    <p class="rounds text-white " id="Rounds">Rounds</p>
            </div>
            <div>
                <p class="text-white font-serif">Group</p>

            </div>
            <div>
                <p class="text-white font-serif">Camp</p>

            </div>
            <div>
                <p class="text-white font-serif">Premiere a jouer </p>
                <p class="role text-white">Empereur</p>
            </div>
        </div>
        <div class="mx-4 mt-5 px-4 bg-[#4A0000] rounded-xl pt-4 h-70">
            <div class="grid grid-cols-3 gap-4">
                <img src="./src/images/Gemini_Generated_Image_x9nmw9x9nmw9x9nm.jpg"  alt=" adversaire" class="w-10 h-10 rounded-xl" >
                <p class="text-white font-serif "> Ordinatur</p>
           
            <div class="border border-2 border-[#990000] rounded-xl place-items-center">
                <p class="font-serif text-white">Score</p>
                <p class="score font-bold text-white"> 0</p>
            </div>
            </div>
<div class="grid grid-cols-5 pt-4 gap-4">

                <div class="border border-2  border-[#990000] rounded-xl place-items-center">
                    <p class="font-serif text-white">Score </p>

<div id="zone-des-cartes" class="grid grid-cols-5 h-70">
